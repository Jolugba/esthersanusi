<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Beat the 404 · Esther Sanusi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --accent:#a06bff; --accent-2:#c98bff;
    --accent-soft:rgba(160,107,255,.16); --accent-glow:rgba(160,107,255,.42);
    --bg:#0a0812; --surface:#15111f; --surface-2:#1c1729;
    --border:rgba(255,255,255,.08); --border-strong:rgba(168,130,255,.18);
    --text:#f5f3fb; --text-dim:#c8c4d6; --text-mute:#8c869c;
    --green:#7ee0a8; --red:#ff7b9c;
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-body:"Inter",system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);color:var(--text);
    background:radial-gradient(1100px 700px at 25% -10%, #1a1330 0%, var(--bg) 60%), var(--bg);
    min-height:100vh;display:grid;place-items:center;padding:1.5rem}
  .wrap{width:100%;max-width:560px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
  .num{font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;font-size:2.4rem;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .score{font-family:var(--font-mono);font-size:.82rem;color:var(--text-mute)}
  .score b{color:var(--accent-2)}
  .card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border-strong);
    border-radius:18px;padding:1.6rem 1.5rem;box-shadow:0 30px 80px -40px rgba(0,0,0,.85)}
  .kicker{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
  .q{font-family:var(--font-display);font-weight:600;font-size:clamp(1.1rem,3vw,1.4rem);line-height:1.4;margin:.5rem 0 1.1rem}
  .opts{display:flex;flex-direction:column;gap:.6rem}
  .opt{font-family:var(--font-body);font-weight:500;font-size:.95rem;text-align:left;cursor:pointer;color:var(--text);
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;transition:all .18s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--green);background:rgba(126,224,168,.12);color:#cfeede}
  .opt.wrong{border-color:var(--red);background:rgba(255,123,156,.1);color:#ffd0db}
  .reveal{margin-top:1.1rem;font-size:.92rem;line-height:1.55;color:var(--text-dim);display:none}
  .reveal.show{display:block;animation:pop .4s var(--ease)}
  .reveal b{color:var(--accent-2)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .next{margin-top:1.1rem;font-family:var(--font-display);font-weight:600;font-size:.95rem;cursor:pointer;border:0;width:100%;
    color:#1a1030;background:linear-gradient(180deg,var(--accent-2),var(--accent));padding:.85rem;border-radius:12px;
    display:none;transition:transform .2s var(--ease)}
  .next.show{display:block}.next:hover{transform:translateY(-2px)}
  .end{text-align:center}
  .end .big{font-family:var(--font-display);font-weight:700;font-size:clamp(1.4rem,4vw,2rem);margin:.3rem 0}
  .home{display:inline-flex;gap:.5rem;margin-top:1.1rem;font-family:var(--font-display);font-weight:600;
    color:#1a1030;background:linear-gradient(180deg,var(--accent-2),var(--accent));padding:.8rem 1.5rem;border-radius:999px;text-decoration:none}
  .sub{text-align:center;color:var(--text-mute);font-size:.82rem;margin-top:1rem}
  .sub a{color:var(--accent-2);text-decoration:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="num">404</div>
      <div class="score">lost, but learning · score <b id="score">0</b>/<span id="total">0</span></div>
    </div>
    <div class="card" id="card"></div>
    <p class="sub">Page not found — so let's make it fun. Real answers go <a href="/">home</a>.</p>
  </main>

<script>
/* EDIT ME: mix coding trivia + two-truths about Esther. correct = index of right answer. */
const Q=[
  {k:"Coding trivia",q:"What was the very first computer 'bug'?",
   a:["A typo in FORTRAN","An actual moth in a relay","A failed punch card","A power surge"],c:1,
   r:"💡 A real <b>moth</b>, found in a Harvard Mark II relay in 1947 — taped right into the logbook."},
  {k:"Guess about Esther",q:"How many people have Esther's apps reached?",
   a:["~100K","~1 million","10M+","Hard to say"],c:2,
   r:"🚀 <b>10M+ people</b> across 20+ live apps — in fintech, legal tech & civic tech."},
  {k:"Coding trivia",q:"Python the language is named after…",
   a:["The snake","Monty Python","A Greek myth","Its creator's cat"],c:1,
   r:"🐍 <b>Monty Python</b> — Guido van Rossum was a fan. Not the snake at all."},
  {k:"Guess about Esther",q:"Which platforms does Esther ship to?",
   a:["Android only","Android + iOS","Android, iOS, Windows & macOS","Web only"],c:2,
   r:"📱 <b>All four</b> — Kotlin Multiplatform lets one codebase travel everywhere."},
  {k:"Coding trivia",q:"Who wrote the first algorithm — in the 1840s?",
   a:["Alan Turing","Ada Lovelace","Grace Hopper","Charles Babbage"],c:1,
   r:"✨ <b>Ada Lovelace</b> — a full century before computers existed."},
];
let i=0, score=0;
document.getElementById("total").textContent=Q.length;
const card=document.getElementById("card");

function render(){
  if(i>=Q.length){
    const msg = score===Q.length?"Flawless. You should be building things too.":
                score>=3?"Sharp. You clearly belong here.":"The 404 wins this round — but you learned a few things. 😄";
    card.innerHTML=`<div class="end">
      <p class="kicker">game over</p>
      <p class="big">You scored ${score}/${Q.length}</p>
      <p style="color:var(--text-dim)">${msg}</p>
      <a class="home" href="/">Take me home →</a>
    </div>`;
    return;
  }
  const item=Q[i];
  card.innerHTML=`
    <p class="kicker">${item.k} · ${i+1}/${Q.length}</p>
    <p class="q">${item.q}</p>
    <div class="opts">${item.a.map((o,idx)=>`<button class="opt" data-i="${idx}">${o}</button>`).join("")}</div>
    <p class="reveal" id="reveal">${item.r}</p>
    <button class="next" id="next">${i===Q.length-1?"See my score →":"Next question →"}</button>`;
  card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(b,item)));
  card.querySelector("#next").addEventListener("click",()=>{i++;render();});
}
function choose(btn,item){
  const picked=+btn.dataset.i;
  card.querySelectorAll(".opt").forEach((b,idx)=>{
    b.disabled=true;
    if(idx===item.c)b.classList.add("correct");
    else if(idx===picked)b.classList.add("wrong");
  });
  if(picked===item.c){score++;document.getElementById("score").textContent=score;}
  card.querySelector("#reveal").classList.add("show");
  card.querySelector("#next").classList.add("show");
}
render();
</script>
</body>
</html>
